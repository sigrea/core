name: publish
on:
  push:
    tags:
      - 'v*'
permissions:
  id-token: write
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    concurrency: publish-${{ github.ref }}
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run cicheck
      - name: Ensure npm CLI supports trusted publishing
        run: |
          npm i -g npm@11.5.1
          npm --version

      - name: Detect already-published version
        id: npmcheck
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack publishable tarball (resolve pnpm catalogs)
        if: steps.npmcheck.outputs.published != 'true'
        run: pnpm pack --out "$RUNNER_TEMP/sigrea-package.tgz"

      - name: npm publish (OIDC trusted publishing)
        if: steps.npmcheck.outputs.published != 'true'
        run: npm publish "$RUNNER_TEMP/sigrea-package.tgz" --access public

      - name: Sync GitHub Release notes via changelogen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vp exec changelogen gh release ${{ github.ref_name }} --token "${GITHUB_TOKEN}"
